---
name: Manage Repo Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/repo_labels.yml
      - .github/workflows/manage_repo_labels.yml
  workflow_dispatch:

jobs:
  manage-repo-labels:
    name: Manage Repo Labels
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__manage-repo-labels.yml@main
    permissions:
      issues: write
